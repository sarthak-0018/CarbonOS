services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carbonos}
      POSTGRES_USER: ${POSTGRES_USER:-carbonos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carbonos} -d ${POSTGRES_DB:-carbonos}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      RECEIPT_STORAGE_DIR: /uploads/receipts
      PADDLE_HOME: /models/paddle
      PADDLE_PDX_CACHE_HOME: /models/paddle
      OCR_LANGUAGE: ${OCR_LANGUAGE:-en}
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - receipt_uploads:/uploads/receipts
      - paddle_models:/models/paddle
      - ./scripts:/app/scripts:ro
      - ./data:/app/data:ro
volumes:
  postgres_data:
  receipt_uploads:
  paddle_models:
